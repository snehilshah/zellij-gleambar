[package]
name = "zellij-gleambar"
version = "0.1.0"
edition = "2021"
description = "One-line Zellij tab bar with a fixed mode badge, themed from the active Zellij theme"
license = "MIT"
repository = "https://github.com/snehilshah/zellij-gleambar"

[dependencies]
zellij-tile = "0.45.1"
unicode-width = { version = "0.2.2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
